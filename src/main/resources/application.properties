spring.application.name=tp3-mvc
server.port=8094

# Base H2 en mémoire (par défaut)
spring.datasource.url=jdbc:h2:mem:products-db
spring.datasource.username=sa
spring.datasource.password=

# Pour utiliser MySQL (XAMPP / WAMP), commenter les 3 lignes datasource ci-dessus et décommenter :
# spring.datasource.url=jdbc:mysql://localhost:3306/products-db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.thymeleaf.cache=false
